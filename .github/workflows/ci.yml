name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Start app (uvicorn) in background
        run: |
          nohup python -m uvicorn sultrytai.api:app --host 127.0.0.1 --port 8001 &
          # wait for metrics endpoint
          for i in {1..10}; do
            sleep 1
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8001/metrics || true)
            if [ "$status" = "200" ]; then
              echo "metrics ready"
              break
            fi
          done
      - name: Smoke test metrics endpoint
        run: |
          curl -sSf http://127.0.0.1:8001/metrics | head -n 5
      - name: Run split script
        run: python scripts/split_full_catalog.py
      - name: Check max lines
        run: python scripts/check_max_lines.py
      - name: Validate factors
        run: python scripts/validate_factors.py
      - name: Run tests
        run: pytest -q
