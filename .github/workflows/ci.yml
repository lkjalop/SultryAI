name: CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sultry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f sultrytai/requirements.txt ]; then pip install -r sultrytai/requirements.txt; fi
          pip install -r requirements-ci.txt

      - name: Wait for Postgres (script)
        run: |
          python ci/wait_for_postgres.py --dsn postgresql://postgres:postgres@127.0.0.1:5432/sultry --timeout 60

      - name: Export envs for tests
        run: |
          echo "SULTRY_SQLITE_DB=$(pwd)/data/ci_sultry.db" >> $GITHUB_ENV
          echo "VECTOR_PG_DSN=postgresql://postgres:postgres@127.0.0.1:5432/sultry" >> $GITHUB_ENV

      - name: Run incremental tests
        run: python -u scripts/run_tests_incremental.py --timeout 120

