name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run split script
        run: python scripts/split_full_catalog.py
      - name: Check max lines
        run: python scripts/check_max_lines.py
      - name: Validate factors
        run: python scripts/validate_factors.py
      - name: Run tests
        run: pytest -q
